<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 // Signal Lost — Chatakommu Sai Chaitanya</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,300&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e1526;
    --bg-panel: #131b30;
    --grid-line: rgba(139,152,181,0.09);
    --border: rgba(231,163,62,0.3);
    --border-quiet: rgba(139,152,181,0.18);
    --text-primary: #f2f4f9;
    --text-secondary: #8b98b6;
    --text-tertiary: #5c6689;
    --amber: #e7a33e;
    --teal: #57d6c9;
    --font-display: 'Fraunces', serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 48px 48px;
    color: var(--text-primary);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .panel {
    position: relative;
    background: var(--bg-panel);
    border: 1px solid var(--border-quiet);
    padding: 48px 40px;
    max-width: 540px;
    width: 100%;
    text-align: center;
  }
  .panel::before, .panel::after,
  .panel .bl, .panel .br {
    content: '';
    position: absolute;
    width: 14px; height: 14px;
    border-color: var(--amber);
    opacity: 0.8;
  }
  .panel::before { top: -1px; left: -1px; border-top: 2px solid var(--amber); border-left: 2px solid var(--amber); }
  .panel::after { top: -1px; right: -1px; border-top: 2px solid var(--amber); border-right: 2px solid var(--amber); }
  .panel .bl { bottom: -1px; left: -1px; border-bottom: 2px solid var(--amber); border-left: 2px solid var(--amber); }
  .panel .br { bottom: -1px; right: -1px; border-bottom: 2px solid var(--amber); border-right: 2px solid var(--amber); }
  .kicker {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--amber);
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  h1 {
    font-family: var(--font-display);
    font-size: 44px;
    font-weight: 500;
    margin-bottom: 16px;
  }
  p {
    color: var(--text-secondary);
    font-size: 15px;
    margin-bottom: 28px;
    line-height: 1.6;
  }
  .btn {
    font-family: var(--font-mono);
    font-size: 13px;
    text-decoration: none;
    padding: 12px 24px;
    border: 1px solid var(--amber);
    background: var(--amber);
    color: #0e1526;
    font-weight: 600;
    display: inline-block;
    transition: all 0.2s;
  }
  .btn:hover {
    background: transparent;
    color: var(--amber);
  }
  .foot {
    margin-top: 24px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-tertiary);
  }
</style>
</head>
<body>
  <div class="panel">
    <span class="bl"></span><span class="br"></span>
    <div class="kicker">ERROR // 404 — ROUTE NOT FOUND</div>
    <h1>Signal Lost</h1>
    <p>The requested dossier record or endpoint does not exist or has been relocated to another coordinate.</p>
    <a href="./" class="btn">Return to Headquarters →</a>
    <div class="foot">Chatakommu Sai Chaitanya · Builder Dossier</div>
  </div>
</body>
</html>
